  <!-- Verified Realty Sub-tag -->
  <text x="52.5" y="38" font-family="'Manrope', -apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#94A3B8" letter-spacing="2.2">VERIFIED REALTY</text>
